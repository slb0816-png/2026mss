<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중1 과학: 물질의 상태 변화 마스터 퀴즈</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --correct-bg: #dcfce7;
            --correct-text: #166534;
            --incorrect-bg: #fee2e2;
            --incorrect-text: #991b1b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        header p {
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            padding: 24px;
            margin-bottom: 20px;
        }

        #start-screen {
            text-align: center;
            padding: 40px 20px;
        }

        #start-screen h2 {
            margin-bottom: 16px;
            font-size: 1.3rem;
        }

        #start-screen p {
            margin-bottom: 24px;
            color: var(--text-muted);
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background-color: var(--border-color);
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--primary-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 20px;
            white-space: pre-line;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background-color: white;
            border: 2px solid var(--border-color);
            padding: 14px 16px;
            text-align: left;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary-color);
            background-color: #f0f7ff;
        }

        .option-btn:disabled {
            cursor: default;
        }

        .option-btn.correct-select {
            background-color: var(--correct-bg);
            border-color: #22c55e;
            color: var(--correct-text);
            font-weight: 600;
        }

        .option-btn.incorrect-select {
            background-color: var(--incorrect-bg);
            border-color: #ef4444;
            color: var(--incorrect-text);
            font-weight: 600;
        }

        .feedback-section {
            margin-top: 20px;
            display: none;
        }

        .feedback-section.active {
            display: block;
        }

        .result-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 12px;
        }

        .result-badge.correct {
            background-color: var(--correct-bg);
            color: var(--correct-text);
        }

        .result-badge.incorrect {
            background-color: var(--incorrect-bg);
            color: var(--incorrect-text);
        }

        table.explanation-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            margin-top: 10px;
            margin-bottom: 20px;
            background: white;
        }

        table.explanation-table th, table.explanation-table td {
            border: 1px solid var(--border-color);
            padding: 8px 10px;
            text-align: left;
            vertical-align: top;
        }

        table.explanation-table th {
            background-color: #f1f5f9;
            font-weight: 600;
            color: var(--text-main);
        }

        .highlight-row {
            background-color: #f8fafc;
            font-weight: 600;
        }

        .next-btn-container {
            text-align: right;
        }

        #result-screen {
            text-align: center;
            display: none;
        }

        #result-screen h2 {
            font-size: 1.5rem;
            margin-bottom: 12px;
            color: var(--primary-color);
        }

        .score-display {
            font-size: 2.5rem;
            font-weight: 800;
            margin: 20px 0;
            color: var(--text-main);
        }

        .analysis-box {
            text-align: left;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .analysis-box h3 {
            font-size: 1.05rem;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .analysis-box ul {
            padding-left: 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .analysis-box li {
            margin-bottom: 6px;
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .card { padding: 16px; }
            table.explanation-table { font-size: 0.75rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>물질의 상태 변화 마스터 퀴즈</h1>
            <p>중학교 1학년 과학 | 용어, 열에너지 출입, 일상생활 예시 완벽 정복</p>
        </header>

        <!-- 시작 화면 -->
        <div id="start-screen" class="card">
            <h2>준비되셨나요?</h2>
            <p>총 20문항의 퀴즈를 풀며 상태 변화 개념과 오개념을 바로잡아 보세요!<br>문항을 풀면 즉시 상세한 해설 표가 제공됩니다.</p>
            <button class="btn" onclick="startQuiz()">퀴즈 시작하기</button>
        </div>

        <!-- 퀴즈 진행 화면 -->
        <div id="quiz-screen" class="card" style="display: none;">
            <div class="quiz-header">
                <span id="question-counter">문항 1 / 20</span>
                <span id="category-badge" style="background:#e0f2fe; color:#0369a1; padding:2px 8px; border-radius:4px;">카테고리</span>
            </div>
            <div class="progress-bar-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            
            <div id="question-text" class="question-title">문제 내용이 여기에 들어갑니다.</div>
            
            <div id="options-container" class="options-container"></div>

            <!-- 즉시 피드백 및 해설 표 영역 -->
            <div id="feedback-section" class="feedback-section">
                <div id="result-badge" class="result-badge">정답입니다!</div>
                <div style="font-size: 0.9rem; font-weight: 700; margin-bottom: 4px;">선지별 상세 분석 해설:</div>
                <div style="overflow-x: auto;">
                    <table class="explanation-table">
                        <thead>
                            <tr>
                                <th>선지</th>
                                <th>정오</th>
                                <th>이 선지를 고르는 학생의 생각 (오개념 분석)</th>
                                <th>바로잡기 (과학적 사실)</th>
                            </tr>
                        </thead>
                        <tbody id="feedback-table-body"></tbody>
                    </table>
                </div>
                <div class="next-btn-container">
                    <button class="btn" onclick="nextQuestion()">다음 문제로</button>
                </div>
            </div>
        </div>

        <!-- 결과 화면 -->
        <div id="result-screen" class="card">
            <h2>퀴즈 완료! 수고하셨습니다 👏</h2>
            <p>나의 최종 점수</p>
            <div id="final-score" class="score-display">0 / 20 점</div>
            
            <div class="analysis-box">
                <h3>🔍 오개념 진단 및 피드백 리포트</h3>
                <ul id="analysis-list"></ul>
            </div>
            
            <button class="btn" onclick="restartQuiz()">다시 풀기</button>
        </div>
    </div>

    <script>
        const quizData = [
            {
                category: "융해",
                question: "1. 고체 상태의 얼음이 액체 상태인 물로 변하는 상태 변화의 이름과 열에너지 출입으로 옳은 것은?",
                options: [
                    "① 응고 - 주변의 열을 흡수한다.",
                    "② 융해 - 주변의 열을 방출한다.",
                    "③ 융해 - 주변의 열을 흡수한다.",
                    "④ 기화 - 주변의 열을 흡수한다."
                ],
                answer: 2,
                misconceptions: [
                    { option: "①", correctness: "X", thought: "얼음이 녹을 때를 응고라고 헷갈렸거나 열 출입 방향을 잘못 생각함.", correction: "고체가 액체로 변하는 것은 '융해'이며, 주변 열을 흡수합니다." },
                    { option: "②", correctness: "X", thought: "융해 용어는 맞혔으나, 녹을 때 시원해지는 현상을 열 방출로 오해함.", correction: "고체가 녹을(융해될) 때는 주변의 열을 흡수하는 '흡열' 과정입니다." },
                    { option: "③", correctness: "O", thought: "정답", correction: "고체가 액체로 변하는 것은 융해이며 열을 흡수합니다." },
                    { option: "④", correctness: "X", thought: "액체가 기체로 변하는 기화와 융해를 혼동함.", correction: "얼음이 물이 되는 것은 고체에서 액체로 변하는 '융해'입니다." }
                ]
            },
            {
                category: "응고",
                question: "2. 겨울철에 물이 얼어 얼음이 되는 상태 변화(응고)가 일어날 때, 주변의 열에너지와 입자 운동은 어떻게 변할까요?",
                options: [
                    "① 주변으로 열을 방출하며, 입자 운동이 느려진다.",
                    "② 주변의 열을 흡수하며, 입자 운동이 활발해진다.",
                    "③ 주변으로 열을 방출하며, 입자 간 거리가 멀어진다.",
                    "④ 열 출입은 없으며, 입자 크기가 작아진다."
                ],
                answer: 0,
                misconceptions: [
                    { option: "①", correctness: "O", thought: "정답", correction: "액체가 고체가 되는 응고는 열을 방출(발열)하며 입자 운동이 둔해집니다." },
                    { option: "②", correctness: "X", thought: "얼음이 될 때 주변이 차가워지므로 열을 흡수한다고 오해함.", correction: "얼음이 얼면서 주변으로 열을 내어놓는 '발열' 과정입니다." },
                    { option: "③", correctness: "X", thought: "얼음이 되면 부피가 커지므로 입자 거리가 멀어진다고 오해함.", correction: "얼음이 될 때 부피는 커지지만 전체적인 입자 배열은 규칙적으로 고정되며 열을 방출합니다." },
                    { option: "④", correctness: "X", thought: "상태가 변해도 입자 크기나 열 출입이 없다고 생각함.", correction: "물질의 상태가 변할 때는 반드시 열에너지의 출입이 있습니다." }
                ]
            },
            {
                category: "기화",
                question: "3. 젖은 머리카락을 드라이기로 말리거나 빨래가 마르는 현상에서 일어나는 상태 변화와 열에너지 출입은?",
                options: [
                    "① 기화 - 열을 방출한다.",
                    "② 액화 - 열을 흡수한다.",
                    "③ 기화 - 열을 흡수한다.",
                    "④ 승화 - 열을 흡수한다."
                ],
                answer: 2,
                misconceptions: [
                    { option: "①", correctness: "X", thought: "기화 용어는 맞혔으나 열 출입을 방출로 오해함.", correction: "액체가 기체로 변할(기화) 때는 주변의 열을 흡수합니다." },
                    { option: "②", correctness: "X", thought: "물기가 사라지는 현상을 액화나 열 흡수와 섞어서 생각함.", correction: "액체가 기체가 되는 것은 기화입니다." },
                    { option: "③", correctness: "O", thought: "정답", correction: "액체가 기체로 변하는 '기화'이며, 주변 열을 흡수합니다." },
                    { option: "④", correctness: "X", thought: "물이 공기 중으로 사라지는 것을 승화로 착각함.", correction: "물(액체)이 수증기(기체)가 되는 것은 기화입니다." }
                ]
            },
            {
                category: "액화",
                question: "4. 차가운 음료수 캔을 밖에 두었을 때 캔 겉면에 물방울이 맺히는 현상(액화)에 대한 설명으로 옳은 것은?",
                options: [
                    "① 공기 중의 수증기가 열을 흡수하여 액화된다.",
                    "② 캔 내부의 물이 밖으로 새어 나와 맺힌 것이다.",
                    "③ 기체인 수증기가 액체인 물로 변하며 열을 방출한다.",
                    "④ 액체인 물이 기체로 변하는 기화 현상이다."
                ],
                answer: 2,
                misconceptions: [
                    { option: "①", correctness: "X", thought: "액화될 때 열을 흡수한다고 생각함.", correction: "기체가 액체로 될(액화) 때는 주변으로 열을 방출합니다." },
                    { option: "②", correctness: "X", thought: "캔이 땀을 흘리거나 물이 투과해 나온다고 오해하는 대표적 오개념.", correction: "캔 밖의 공기 중 수증기가 차가운 캔 표면에 닿아 물방울로 변한 것입니다." },
                    { option: "③", correctness: "O", thought: "정답", correction: "기체(수증기)가 액체(물)로 변하는 액화이며, 열을 방출합니다." },
                    { option: "④", correctness: "X", thought: "물방울이 생기는 것을 기화로 잘못 명명함.", correction: "수증기가 물방울이 되는 것은 액화입니다." }
                ]
            },
            {
                category: "승화",
                question: "5. 겨울철 빨래가 추운 날씨에 꽁꽁 얼었다가 마르거나, 드라이아이스가 크기가 점점 작아지는 현상은 어떤 상태 변화인가요?",
                options: [
                    "① 액화 (기체 → 액체)",
                    "② 승화 (고체 → 기체)",
                    "③ 기화 (액체 → 기체)",
                    "④ 융해 (고체 → 액체)"
                ],
                answer: 1,
                misconceptions: [
                    { option: "①", correctness: "X", thought: "고체가 기체로 되는 과정을 액화로 혼동함.", correction: "액체를 거치지 않고 고체에서 바로 기체로 변하는 것은 승화입니다." },
                    { option: "②", correctness: "O", thought: "정답", correction: "고체에서 기체로 직접 변하는 '승화(고체 → 기체)'이며 열을 흡수합니다." },
                    { option: "③", correctness: "X", thought: "고체가 액체를 거쳐 날아간다고 생각함.", correction: "영하의 온도에서 얼음이 액체 없이 바로 수증기가 되는 것은 승화입니다." },
                    { option: "④", correctness: "X", thought: "작아지는 현상을 녹는 것(융해)으로 착각함.", correction: "드라이아이스는 액체 상태를 거치지 않고 기체로 바로 변합니다." }
                ]
            },
            {
                category: "승화",
                question: "6. 겨울철 창문 안쪽에 아름다운 성에(눈꽃)가 생기는 현상은 어떤 상태 변화이며 열 출입은 어떠한가요?",
                options: [
                    "① 승화 (기체 → 고체) - 열을 방출한다.",
                    "② 승화 (고체 → 기체) - 열을 흡수한다.",
                    "③ 액화 (기체 → 액체) - 열을 방출한다.",
                    "④ 응고 (액체 → 고체) - 열을 흡수한다."
                ],
                answer: 0,
                misconceptions: [
                    { option: "①", correctness: "O", thought: "정답", correction: "공기 중의 수증기가 차가운 창문에 닿아 고체 얼음(성에)으로 바로 변하는 승화(기체 → 고체)이며 열을 방출합니다." },
                    { option: "②", correctness: "X", thought: "방향이 고체에서 기체로 가는 승화라고 잘못 생각함.", correction: "성에가 생기는 것은 수증기가 얼어붙는 기체 → 고체 승화입니다." },
                    { option: "③", correctness: "X", thought: "이슬이 맺힌 후 얼었다고 생각함.", correction: "기체가 액체를 거치지 않고 바로 고체로 되는 승화 현상입니다." },
                    { option: "④", correctness: "X", thought: "액체가 어는 응고 현상으로 착각함.", correction: "기체 상태에서 직접 고체로 변하는 승화입니다." }
                ]
            },
            {
                category: "열에너지",
                question: "7. 다음 중 상태 변화가 일어날 때 열을 흡수하는(흡열) 과정끼리 바르게 묶인 것은?",
                options: [
                    "① 융해, 기화, 승화(고체→기체)",
                    "② 응고, 액화, 승화(기체→고체)",
                    "③ 융해, 응고, 기화",
                    "④ 기화, 액화, 융해"
                ],

                    { option: "④", correctness: "X", thought: "드라이아이스 승화(흡열) 과정임.", correction: "드라이아이스 승화는 열을 흡수합니다." }
                ]
            },
            {
                category: "상태 변화 총정리",
                question: "20. 물질의 상태 변화에 대한 설명으로 옳은 것만을 보기에서 있는 대로 고른 것은?\n\n[보기] ㄱ. 융해와 기화는 주변의 열을 흡수한다.\nㄴ. 액화가 될 때는 입자 운동이 활발해진다.\nㄷ. 승화는 고체에서 기체로, 또는 기체에서 고체로 변하는 현상이다.",
                options: [
                    "① ㄱ",
                    "② ㄴ, ㄷ",
                    "③ ㄱ, ㄷ",
                    "④ ㄱ, ㄴ, ㄷ"
                ],
                answer: 2,
                misconceptions: [
                    { option: "①", correctness: "X", thought: "ㄱ은 맞지만 ㄷ도 맞음을 놓침.", correction: "ㄷ(승화 정의)도 올바른 설명입니다." },
                    { option: "②", correctness: "X", thought: "ㄴ이 틀렸음을 간과함.", correction: "액화될 때는 열을 방출하므로 입자 운동이 둔해집니다." },
                    { option: "③", correctness: "O", thought: "정답", correction: "ㄱ(융해, 기화는 흡열), ㄷ(승화의 양방향 정의)이 모두 옳습니다. ㄴ은 액화 시 입자 운동이 둔해지므로 틀립니다." },
                    { option: "④", correctness: "X", thought: "모두 맞다고 착각함.", correction: "ㄴ 보기에서 액화 시 입자 운동은 둔해집니다." }
                ]
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let userAnswers = [];

        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const questionCounter = document.getElementById('question-counter');
        const categoryBadge = document.getElementById('category-badge');
        const progressBar = document.getElementById('progress-bar');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const feedbackSection = document.getElementById('feedback-section');
        const resultBadge = document.getElementById('result-badge');
        const feedbackTableBody = document.getElementById('feedback-table-body');
        const finalScore = document.getElementById('final-score');
        const analysisList = document.getElementById('analysis-list');

        function startQuiz() {
            startScreen.style.display = 'none';
            quizScreen.style.display = 'block';
            currentQuestionIndex = 0;
            score = 0;
            userAnswers = [];
            loadQuestion();
        }

        function loadQuestion() {
            feedbackSection.classList.remove('active');
            const q = quizData[currentQuestionIndex];
            
            questionCounter.innerText = `문항 ${currentQuestionIndex + 1} / ${quizData.length}`;
            categoryBadge.innerText = q.category;
            progressBar.style.width = `${((currentQuestionIndex) / quizData.length) * 100}%`;
            
            questionText.innerText = q.question;
            optionsContainer.innerHTML = '';

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => selectAnswer(index);
                optionsContainer.appendChild(btn);
            });
        }

        function selectAnswer(selectedIndex) {
            const q = quizData[currentQuestionIndex];
            const isCorrect = (selectedIndex === q.answer);
            
            userAnswers.push({
                questionIndex: currentQuestionIndex,
                category: q.category,
                selectedIndex: selectedIndex,
                correctIndex: q.answer,
                isCorrect: isCorrect
            });

            if (isCorrect) {
                score++;
                resultBadge.innerText = "정답입니다! 👏";
                resultBadge.className = "result-badge correct";
            } else {
                resultBadge.innerText = "틀렸습니다. 아래 해설을 확인해 보세요.";
                resultBadge.className = "result-badge incorrect";
            }

            const buttons = optionsContainer.getElementsByClassName('option-btn');
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].disabled = true;
                if (i === q.answer) {
                    buttons[i].classList.add('correct-select');
                } else if (i === selectedIndex && !isCorrect) {
                    buttons[i].classList.add('incorrect-select');
                }
            }

            feedbackTableBody.innerHTML = '';
            q.misconceptions.forEach((item, idx) => {
                const tr = document.createElement('tr');
                if (idx === q.answer) {
                    tr.className = 'highlight-row';
                }
                if (idx === selectedIndex) {
                    tr.style.backgroundColor = isCorrect ? '#f0fdf4' : '#fef2f2';
                }

                tr.innerHTML = `
                    <td><strong>${item.option}</strong></td>
                    <td><strong>${idx === q.answer ? '정답' : (idx === selectedIndex ? '선택함' : '-')}</strong></td>
                    <td>${item.thought}</td>
                    <td>${item.correction}</td>
                `;
                feedbackTableBody.appendChild(tr);
            });

            feedbackSection.classList.add('active');
            feedbackSection.scrollIntoView({ behavior: 'smooth' });
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
                quizScreen.scrollIntoView({ behavior: 'smooth' });
            } else {
                showResult();
            }
        }

        function showResult() {
            quizScreen.style.display = 'none';
            resultScreen.style.display = 'block';
            finalScore.innerText = `${score} / ${quizData.length} 점`;

            let wrongCategories = {};
            userAnswers.forEach(ans => {
                if (!ans.isCorrect) {
                    wrongCategories[ans.category] = (wrongCategories[ans.category] || 0) + 1;
                }
            });

            analysisList.innerHTML = '';
            let htmlContent = `<li>총 <strong>${quizData.length}문항</strong> 중 <strong>${score}문항</strong>을 맞히셨습니다. (정답률: ${Math.round((score/quizData.length)*100)}%)</li>`;
            
            if (Object.keys(wrongCategories).length === 0) {
                htmlContent += `<li>🎉 모든 개념을 완벽하게 이해하셨습니다! 상태 변화 마스터입니다.</li>`;
            } else {
                htmlContent += `<li>취약한 개념 영역 분석:</li>`;
                for (let cat in wrongCategories) {
                    htmlContent += `<li>- <strong>[${cat}]</strong> 영역에서 총 ${wrongCategories[cat]}문항을 틀렸습니다. 이 부분의 용어와 열에너지 출입(흡열/발열) 개념을 다시 복습해 보세요!</li>`;
                }
            }
            analysisList.innerHTML = htmlContent;
            resultScreen.scrollIntoView({ behavior: 'smooth' });
        }

        function restartQuiz() {
            resultScreen.style.display = 'none';
            startScreen.style.display = 'block';
            startScreen.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
